# Render Deployment Configuration for SmartCampusAI / Acadivo
# Docs: https://render.com/docs/yaml

services:
  # 1. Express Backend Auth & API Server
  - type: web
    name: smartcampus-auth-server
    env: node
    buildCommand: npm install
    startCommand: node auth-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # 2. Expo React Native Web Application
  - type: web
    name: smartcampus-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
